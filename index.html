<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLM-5.3-flash × ExploitBench — live</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{
    --paper:#ffffff;
    --ink:#111418;
    --muted:#66605c;
    --rule:#e2e2e2;
    --grid:#ececec;
    --mean:#0d7680;       /* teal */
    --floor:#7a9a3a;      /* muted olive */
    --mythos:#990f3d;     /* claret */
    --gpt:#b85c1f;        /* burnt orange */
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .sans{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:48px 24px 64px}
  h1{font-size:30px;line-height:1.18;font-weight:700;margin:0 0 10px;letter-spacing:-0.01em;
     text-align:center}
  .standfirst{font-size:17px;line-height:1.45;color:var(--muted);margin:0 auto 24px;
     text-align:center;max-width:60ch}
  .whatis{text-align:center;margin:0 0 20px}
  .whatis summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px;
    display:inline-flex;align-items:center;gap:6px;user-select:none}
  .whatis summary::-webkit-details-marker{display:none}
  .whatis .arrow{display:inline-block;transition:transform .18s ease;font-size:11px}
  .whatis[open] .arrow{transform:rotate(90deg)}
  .whatis p{color:var(--muted);font-size:14px;line-height:1.5;max-width:56ch;
    margin:10px auto 0}
  .whatis a{color:var(--mean);text-decoration:none;border-bottom:1px solid var(--mean)}
  .rule{height:3px;background:var(--ink);border:0;margin:0 0 22px}
  .stats{display:flex;flex-wrap:wrap;gap:26px;margin:0 0 22px}
  .stat .k{font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .stat .v{font-size:26px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .chartbox{position:relative;height:470px;margin:6px 0 4px}
  .countdown{border-top:1px solid var(--rule);margin-top:22px;padding-top:22px;
    text-align:center}
  .cd-label{display:block;text-transform:uppercase;letter-spacing:.14em;
    font-size:12px;color:var(--muted);margin-bottom:6px}
  .cd-time{display:block;font-size:56px;font-weight:700;letter-spacing:-0.02em;
    font-variant-numeric:tabular-nums;line-height:1}
  .cd-time.fresh{color:var(--mean)}
  @media (max-width:560px){ h1{font-size:23px} .chartbox{height:400px} }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">GLM-5.3-Flash on ExploitBench</h1>
  <p class="standfirst" id="standfirst">Is GLM-5.3-Flash Mythos level at cyber?</p>

  <details class="whatis">
    <summary><span class="arrow">▸</span> what is this?</summary>
    <p>
      We at <a href="https://generality.org" target="_blank" rel="noopener">Generality Labs</a>
      are running GLM-5.3-Flash on ExploitBench because we believe it may be
      Mythos-level at cyber at matched inference budgets.
    </p>
  </details>

  <hr class="rule">

  <div class="chartbox"><canvas id="chart"></canvas></div>

  <div class="countdown">
    <span class="cd-label">new data in</span>
    <span class="cd-time" id="cd">–:–</span>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let chart;

// frontier points: dashed drop-lines to both axes + a label below-right (FT style)
const refGuides = {
  id:'refGuides',
  beforeDatasetsDraw(c){                 // guides UNDER the data
    const ctx=c.ctx, xa=c.scales.x, ya=c.scales.y;
    ctx.save(); ctx.setLineDash([4,4]); ctx.lineWidth=1;
    for(const ds of c.data.datasets){
      if(!ds._refLabel) continue;
      const meta=c.getDatasetMeta(c.data.datasets.indexOf(ds));
      const pt=meta.data[0]; if(!pt) continue;
      ctx.strokeStyle=ds.borderColor; ctx.globalAlpha=.55;
      ctx.beginPath(); ctx.moveTo(pt.x,pt.y); ctx.lineTo(pt.x,ya.bottom); ctx.stroke();  // down
      ctx.beginPath(); ctx.moveTo(pt.x,pt.y); ctx.lineTo(xa.left,pt.y);  ctx.stroke();  // left
    }
    ctx.restore();
  },
  afterDatasetsDraw(c){                   // labels OVER the data
    const ctx=c.ctx; ctx.save();
    ctx.font="600 12px -apple-system, Arial, sans-serif";
    for(const ds of c.data.datasets){
      if(!ds._refLabel) continue;
      const meta=c.getDatasetMeta(c.data.datasets.indexOf(ds));
      const pt=meta.data[0]; if(!pt) continue;
      ctx.fillStyle=ds.borderColor; ctx.textAlign="left"; ctx.textBaseline="top";
      ds._refLabel.split("\n").forEach((ln,i)=> ctx.fillText(ln, pt.x+11, pt.y+8+i*14));
    }
    for(const ds of c.data.datasets){     // curve end-labels
      if(!ds._endLabel) continue;
      const meta=c.getDatasetMeta(c.data.datasets.indexOf(ds));
      const pt=meta.data[meta.data.length-1]; if(!pt) continue;
      ctx.fillStyle=ds.borderColor; ctx.textAlign="left"; ctx.textBaseline="middle";
      ctx.fillText(ds._endLabel, pt.x+8, pt.y);
    }
    ctx.restore();
  }
};

function stat(k,v){ return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`; }

let lastStamp=null, stampMs=null, period=3600000, justPushed=false;

async function load(){
  let d;
  try { d = await (await fetch('data.json?_='+Date.now())).json(); }
  catch(e){ $('#updated').textContent='could not load data.json'; return; }

  if(d.updated_utc!==lastStamp){
    if(lastStamp!==null) justPushed=true;   // a genuinely new push arrived
    lastStamp=d.updated_utc;
    stampMs=Date.parse(d.updated_utc.replace(' ','T')+'Z');
    period=(d.refresh_seconds||3600)*1000;
  }

  const mean  = d.mean.map(p=>({x:p[0],y:p[1]}));
  const refDs = d.refs.map(r=>({
    data:[{x:r.cost,y:r.score}], showLine:false, pointStyle:'star',
    radius:12, hoverRadius:14,
    borderColor: r.name.toLowerCase().includes('mythos')?css('--mythos'):css('--gpt'),
    backgroundColor: r.name.toLowerCase().includes('mythos')?css('--mythos'):css('--gpt'),
    borderWidth:1,
    _refLabel:`${r.name}\n${(Math.round(r.score*10)/10)}/16 · $${Math.round(r.cost)}`,
  }));

  const data={datasets:[
    {data:mean, showLine:true, borderColor:css('--mean'), backgroundColor:css('--mean'),
     borderWidth:2.6, pointRadius:0, tension:.15, _endLabel:'mean'},
    ...refDs,
  ]};

  const opts={
    animation:false, maintainAspectRatio:false,
    layout:{padding:{right:96,top:8}},
    scales:{
      x:{ type:'logarithmic',
          title:{display:true,text:'inference cost per vulnerability  ($, log scale)',
                 color:css('--muted'), font:{family:'-apple-system,Arial',size:12}},
          grid:{display:false}, border:{color:css('--rule')},
          ticks:{color:css('--muted'),font:{family:'-apple-system,Arial'},
                 callback:v=>{const l=Math.log10(v);return Math.abs(l-Math.round(l))<1e-9?'$'+v:''}} },
      y:{ min:0,max:16,
          title:{display:true,text:'mean capability score  (/16)',
                 color:css('--muted'),font:{family:'-apple-system,Arial',size:12}},
          grid:{color:css('--grid')}, border:{display:false},
          ticks:{color:css('--muted'),stepSize:4,font:{family:'-apple-system,Arial'}} },
    },
    plugins:{
      legend:{display:false},
      tooltip:{ backgroundColor:'#111', callbacks:{
        label:c=>`${c.parsed.y.toFixed(1)}/16  @  $${c.parsed.x.toPrecision(2)}`}},
    },
  };

  if(chart){chart.data=data;chart.options=opts;chart.update();}
  else chart=new Chart($('#chart'),{type:'scatter',data,options:opts,plugins:[refGuides]});
}

function fmt(ms){
  const s=Math.max(0,Math.round(ms/1000));
  const m=Math.floor(s/60), ss=s%60;
  if(m>=60){ const h=Math.floor(m/60); return h+':'+String(m%60).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
  return m+':'+String(ss).padStart(2,'0');
}
let poll=0;
function tick(){
  const cd=$('#cd'); if(!stampMs){ return; }
  const remaining = stampMs + period - Date.now();
  if(remaining>0){
    justPushed=false; cd.classList.remove('fresh');
    cd.textContent = fmt(remaining);
  } else {
    // past due — poll for the new push; show the fresh state briefly when it lands
    cd.textContent = justPushed ? 'just now' : 'due…';
    if(justPushed) cd.classList.add('fresh');
    poll++;
    if(poll%10===0) load();                      // check every 10s once due
  }
}
load(); setInterval(tick,1000);
</script>
</body>
</html>
